name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LightSwitch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LightSwitch-apk
          path: LightSwitch.apk

      # Keep one "latest" release so the APK has a stable download link for the phone.
      - name: Publish latest release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest LightSwitch.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download LightSwitch.apk on your phone and open it to install."
